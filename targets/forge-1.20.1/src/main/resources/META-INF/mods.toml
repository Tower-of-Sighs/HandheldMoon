modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Tower-of-Sighs/HandheldMoon/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "assets/handheldmoon/icon.png"
displayURL = "https://github.com/Tower-of-Sighs/HandheldMoon"
description = '''${description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "curios"
mandatory = false
versionRange = "[5.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "tacz"
mandatory = false
versionRange = "[1.1,)"
ordering = "AFTER"
side = "BOTH"

[features."${mod_id}"]
openGLVersion = "[3.2,)"
